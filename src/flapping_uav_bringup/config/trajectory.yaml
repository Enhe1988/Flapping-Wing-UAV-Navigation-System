# 水平轨迹配置，修改后重启导航。仅改变XY参考点，不发送高度或yaw目标。
# 启动时用flight_mode:=line或figure8选择，start_here后先定点，手动调用start_trajectory才开始。
# 场地由scene.yaml四基站坐标和uwb.yaml坐标转换自动计算。

# 自动水平轨迹的几何与参考运动参数。
trajectory:
  # 轨迹包络距基站凸多边形边界的内缩距离，单位m；越大活动区域越小，仅用于自动轨迹检查。
  boundary_margin_m: 0.8
  # 八字尺寸相对可用场地的缩放比例，范围(0,1]；调小缩短轨迹，不改变高度。
  figure8_fit_scale: 0.6
  # 八字两叶排列方向：auto按map场地长边选择；也可填带引号的"x"或"y"。
  figure8_axis: auto
  # 每个八字叶片的长宽比例，大于0；1近似圆润，越大叶片越细长；适配时只缩小包络。
  figure8_lobe_aspect_ratio: 1.0
  # 直线两端之间的总长，单位m；沿map X方向往返，必须放得进内缩后的场地。
  line_length_m: 2.0
  # 直线往返的参考相位周期，单位s；越大越慢；受速度/加速度限制时实际周期会自动延长。
  line_period_s: 27.0
  # 八字一圈的参考相位周期，单位s；越大越慢，限速后可能更长，总执行时间还含缓冲。
  figure8_period_s: 70.0
  # 完整往返/八字的圈数，整数且至少1；结束后保持起点。
  cycles: 1
  # 轨迹开始及结束的相位加减速缓冲时间，单位s；不等于飞到起点的接入时间。
  ramp_s: 1.0
  # 移动参考点的速度模长上限，单位m/s；控制目标走多快由它与周期共同决定。
  max_reference_speed_mps: 0.25
  # 移动参考点的加速度模长上限，单位m/s²；减小可降低转弯/加减速负担。
  max_reference_acceleration_mps2: 0.2
  # 当前位置到轨迹起点的计划接入时间下限，单位s；远距离会按限速自动延长。
  min_approach_time_s: 3.0
  # 实际XY距轨迹起点需小于此值才进入正式跟踪，单位m；未到时停留在起点等待。
  start_position_tolerance_m: 0.15
