# Current XY experimental control profile. Restart position_hold after edits.
# Existing gains/limits still require flight-performance evaluation.
position_controller_node:
  ros__parameters:
    map_frame_id: map
    kp_xy: 1.0
    kd_xy: 0.0
    max_speed_mps: 2.0
    max_acceleration_mps2: 1.0
    arrival_position_tolerance_m: 0.05
    arrival_speed_tolerance_mps: 0.05
    arrival_dwell_s: 0.5
    continuous_hold: true
    require_start_here: true
    publish_body_setpoint: true
    use_optical_flow_fallback: true
    # Optical flow is unavailable close to the ground. Only FRESH invalid
    # packets fall back to zero; missing/stale packets still stop control.
    invalid_velocity_as_zero: true
    publish_rate_hz: 50.0
    position_timeout_ms: 500
    feedback_timeout_ms: 1500
    attitude_timeout_ms: 1500
    heartbeat_timeout_ms: 5000
    # Heartbeat is diagnostic in this profile. Continuous source-checked,
    # timestamp-advancing ID31/250 remain mandatory for actual control.
    heartbeat_required: false
    # From FIRST detection of a transient bad/stale input: output zero,
    # keep goal for 2s, resume from zero only if all inputs recover in time.
    # Explicit clock/reference resets bypass this grace and clear immediately.
    input_recovery_grace_ms: 2000
    target_system: 1
    target_component: 1
    feedback_velocity_mode: heading_xy
    feedback_convention_confirmed: true
    assume_zero_world_vertical_speed: false
frame_contract:
  # Runtime service supplies alignment; never reuse an earlier power-on offset.
  map_to_reference_confirmed: false
  attitude_convention_confirmed: true
  quaternion_body_to_ned: true
  map_to_enu_yaw_rad: 0.0
  alignment_requires_session: true
  alignment_max_clock_skew_ms: 2000.0

# communication.launch.py loads these along with pocket_bench.yaml.
mavlink_bridge_node:
  ros__parameters:
    # User hardware direction check, 2026-11-18: invert outgoing ID84 vy only.
    # Internal map/heading FRD calculation and incoming ID250 remain unchanged.
    velocity_y_sign: -1
    # Freshly computed commands are required even when FC telemetry is slower.
    velocity_timeout_ms: 200
    velocity_attitude_timeout_ms: 1500
